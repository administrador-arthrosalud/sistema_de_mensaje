# Proxy restringido: solo deja pasar POST /chat-webhook.php hacia la app.
# Cualquier otra ruta responde 404 antes de llegar a PHP. Así, un túnel público
# apuntado aquí nunca expone la agenda, los chats ni el envío de mensajes.
server {
    listen 80;
    server_tokens off;

    location = /chat-webhook.php {
        limit_except POST { deny all; }
        client_max_body_size 1m;
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 15s;
    }

    location / {
        return 404;
    }
}
