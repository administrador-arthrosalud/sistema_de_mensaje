; Configuración PHP de los contenedores web y sync.
date.timezone = America/Lima
display_errors = Off
log_errors = On
expose_php = Off
; Imágenes adjuntas de hasta 5 MB (con margen para el resto del formulario).
upload_max_filesize = 8M
post_max_size = 10M
session.cookie_httponly = 1
session.use_strict_mode = 1
